name: Train and Deploy ChurnIQ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      - name: Train model
        run: python backend/train_model.py

      - name: Verify model artifact
        run: |
          test -s backend/model/churn_ann.joblib
          test -s backend/model/metrics.json
          python - <<'PY'
          import joblib
          m=joblib.load("backend/model/churn_ann.joblib")
          print("Model artifact loaded:", type(m).__name__)
          PY

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/model/churn_ann.joblib backend/model/metrics.json
          git diff --cached --quiet || git commit -m "chore: update trained churn model"
          git push
