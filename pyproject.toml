[project]
name = "churniq"
version = "2.0.0"
description = "Customer churn prediction and risk intelligence"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "python-multipart>=0.0.9,<1",
]

[tool.vercel]
entrypoint = "backend.main:app"
